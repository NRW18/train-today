# Cloudflare Worker settings for the AI proxy. Deploy from this folder: npx wrangler deploy
# GEMINI_KEY is a secret kept in Cloudflare, never in this file.
# Keep these in step with the dashboard so a deploy does not switch logs off or preview URLs on.
name = "train-today-ai"
main = "worker.js"
compatibility_date = "2026-10-12"
preview_urls = false

[[kv_namespaces]]
binding = "RL"
id = "f20883e472194d99b3f4bd8cbfc65315"

[observability]
enabled = true

[observability.logs]
enabled = true

# Usage stats (anonymous feature counts). Table is created by the worker on first use.
# STATS_KEY (password for stats.html) is a secret: npx wrangler secret put STATS_KEY
[[d1_databases]]
binding = "DB"
database_name = "kryvos-stats"
database_id = "42f9249b-1181-4c6f-9514-4d474ca54efc"
