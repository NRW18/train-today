name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Test builds use a fresh, throwaway key each run. For a real Google Play release,
      # store a permanent upload key as repository secrets instead (see README).
      - name: Create throwaway signing key
        run: |
          KS_PASS=$(openssl rand -hex 16)
          echo "::add-mask::$KS_PASS"
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Norrawat Nakphut, O=NRW, C=TH"
          echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "KS_PATH=$RUNNER_TEMP/test.jks" >> "$GITHUB_ENV"

      - name: Build APK and AAB
        working-directory: android
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/train-today.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/train-today.aab
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: train-today-android
          path: out/

      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: "แอป Android (ทดสอบ)"
          prerelease: true
          body: |
            ไฟล์ทดสอบของแอป วันนี้ฝึกอะไร (Made by Norrawat Nakphut & Krittanun Boonman)
            - train-today.apk: ดาวน์โหลดแล้วติดตั้งบน Android ได้เลย (ต้องกดอนุญาตให้ติดตั้งจากแหล่งที่ไม่รู้จัก)
            - train-today.aab: สำหรับอัปขึ้น Google Play (ไฟล์ทดสอบนี้เซ็นด้วยกุญแจชั่วคราว)
          files: |
            out/train-today.apk
            out/train-today.aab
